title: "Go の設計、どこまでやる？〜小さく作って、壊さず育てる〜"
summary: "「クリーンアーキテクチャというアーキテクチャはない」——大事なのは図の形を真似ることではなく、依存の向き、境界、処理の寿命を設計し、変更に強いサービスを育てることです。本書は、Go でサービスを設計・運用するための判断基準を、原則、ドメイン、アプリケーション、プロセス境界、Observability、継続的な検証、読書ログサービスのハンズオンまで一冊にまとめます。読み終えたとき、自分のサービスを設計し、壊れ方を観測しながら運用できる状態になることがゴールです。"
topics: ["go", "cleanarchitecture", "ddd", "設計", "アーキテクチャ"]
